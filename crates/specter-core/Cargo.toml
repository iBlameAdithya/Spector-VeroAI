[package]
name = "specter-core"
version = "0.1.0"
edition = "2021"
authors = ["SPECTER Core Architecture Group"]
description = "Autonomous On-Chain Incident Response & Evidence Gating Core Library"

[dependencies]
blake3 = "1.5"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
rand = "0.8"
