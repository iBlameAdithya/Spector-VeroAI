[package]
name = "specter-mcp"
version = "0.1.0"
edition = "2021"
authors = ["SPECTER Core Architecture Group"]
description = "Model Context Protocol (MCP) Server for SPECTER Forensic Tools"

[dependencies]
specter-core = { path = "../specter-core" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
blake3 = "1.5"
