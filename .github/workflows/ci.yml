name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust Engine Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Code Formatting Check (rustfmt)
        run: cargo fmt --all -- --check

      - name: Static Analysis & Linting (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests & Benchmarks
        run: cargo test --workspace --verbose

      - name: Build Optimized Release Binary
        run: cargo build --workspace --release

  agent-quality:
    name: Agent & Portal Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Node.js Agent Scripts
        run: |
          node --check crates/specter-agent/portal_server.js
          node --check crates/specter-agent/browser_actor.js

  integration-e2e:
    name: End-to-End Service Verification
    runs-on: ubuntu-latest
    needs: [rust-quality, agent-quality]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Release Engine
        run: cargo build -p specter-server --release

      - name: Run End-to-End Service Tests
        run: |
          # 1. Start Mock Exchange Compliance Portal (Port 3000)
          node crates/specter-agent/portal_server.js &
          PORTAL_PID=$!
          echo "Portal started with PID $PORTAL_PID"

          # 2. Start SPECTER Axum Engine (Port 8080)
          ./target/release/specter-server &
          SERVER_PID=$!
          echo "Server started with PID $SERVER_PID"

          # Wait for services to bind
          sleep 4

          # 3. Verify Health Check
          echo "Testing GET /api/v1/health..."
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/health)
          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "Health check failed with status $HEALTH_STATUS"
            kill $PORTAL_PID $SERVER_PID || true
            exit 1
          fi

          # 4. Verify Trace Canonical Incident
          echo "Testing POST /api/v1/trace..."
          TRACE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"stolen_tx_hash":"0x4a8b7c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b","victim_wallet":"0x71c6bfb575a35b50e76ec92432dd2741b23ac3a9","chain":"ethereum","max_hops":4}' \
            http://localhost:8080/api/v1/trace)
          if [ "$TRACE_STATUS" != "200" ]; then
            echo "Trace endpoint failed with status $TRACE_STATUS"
            kill $PORTAL_PID $SERVER_PID || true
            exit 1
          fi

          # 5. Verify MHA SAHYOG Package Generation
          echo "Testing POST /api/v1/sahyog/package..."
          SAHYOG_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"case_id":"SPECTER-2026-9921","fir_number":"FIR/2026/CYBER-409","police_station":"Special Cyber Crime Cell, New Delhi","officer_badge_id":"INV-LE-4092"}' \
            http://localhost:8080/api/v1/sahyog/package)
          if [ "$SAHYOG_STATUS" != "200" ]; then
            echo "Sahyog package generation failed with status $SAHYOG_STATUS"
            kill $PORTAL_PID $SERVER_PID || true
            exit 1
          fi

          # 6. Verify Tactical Voice Alert & Audio Chime Endpoints
          echo "Testing GET /api/v1/voice/alert/SPECTER-2026-9921..."
          VOICE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/voice/alert/SPECTER-2026-9921)
          if [ "$VOICE_STATUS" != "200" ]; then
            echo "Voice alert failed with status $VOICE_STATUS"
            kill $PORTAL_PID $SERVER_PID || true
            exit 1
          fi

          CHIME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/voice/chime)
          if [ "$CHIME_STATUS" != "200" ]; then
            echo "Voice chime failed with status $CHIME_STATUS"
            kill $PORTAL_PID $SERVER_PID || true
            exit 1
          fi

          # Cleanup background services
          kill $PORTAL_PID $SERVER_PID || true
          echo "End-to-end verification passed successfully!"
